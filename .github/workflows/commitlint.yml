name: Commitlint

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install commitlint
        run: npm ci

      - name: Lint commit messages in PR
        run: |
          npx commitlint \
            --from "origin/${{ github.base_ref }}" \
            --to HEAD \
            --verbose
