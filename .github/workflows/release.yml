name: Release artifacts

# Triggered when a GitHub Release is published (typically by the
# release-please workflow merging its PR + creating the tag). Builds
# the XCFramework, signs it with cosign keyless (sigstore.dev OIDC
# via GitHub Actions identity), generates a CycloneDX SBOM, and
# attaches all assets to the release.
#
# Consumers verify the supply chain via `scripts/verify-release.sh`
# (cosign verify-blob + sha256 check + SBOM inspection).

on:
  # GITHUB_TOKEN-driven release events don't propagate workflows (GH
  # security feature against runaway loops). Listening to `push: tags`
  # instead picks up release-please's tag write directly. The release
  # itself still exists — we just attach assets to it from this run.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-package (e.g. v0.0.1)"
        required: true
        type: string

permissions:
  contents: write       # to upload release assets
  id-token: write       # for cosign keyless OIDC

jobs:
  build-and-sign:
    name: Build, sign, and attach release assets
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `inputs.tag` wins when dispatched manually so the operator
          # can re-package an existing tag; otherwise checkout the tag
          # that triggered the push event.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Show selected Xcode version
        run: xcodebuild -version

      - name: Read VERSION
        id: ver
        run: |
          v=$(awk '{print $1; exit}' VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "Building Beeping v$v"

      - name: Build Beeping.xcframework
        run: ./build.sh

      - name: Zip the XCFramework
        id: zip
        run: |
          set -euo pipefail
          cd dist
          zip -rq Beeping.xcframework.zip Beeping.xcframework
          sha=$(shasum -a 256 Beeping.xcframework.zip | awk '{print $1}')
          echo "checksum=$sha" >> "$GITHUB_OUTPUT"
          printf "%s  Beeping.xcframework.zip\n" "$sha" > Beeping.xcframework.zip.sha256
          echo "SHA256: $sha"
          ls -la Beeping.xcframework.zip Beeping.xcframework.zip.sha256

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign (XCFramework zip)
        # Keyless signing uses the GitHub Actions OIDC identity to
        # request a short-lived signing certificate from Fulcio
        # (sigstore.dev). Signature + cert are uploaded to the
        # transparency log (rekor) — verifiable by anyone without
        # any pre-shared key.
        run: |
          cd dist
          cosign sign-blob --yes \
            --bundle Beeping.xcframework.zip.cosign.bundle \
            Beeping.xcframework.zip

      - name: Install syft (for SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOM
        run: |
          cd dist
          syft Beeping.xcframework \
            --output cyclonedx-json=Beeping.sbom.cdx.json
          echo "---SBOM head---"
          head -c 2000 Beeping.sbom.cdx.json || true
          echo

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          gh release upload \
            "${{ steps.ver.outputs.tag }}" \
            Beeping.xcframework.zip \
            Beeping.xcframework.zip.sha256 \
            Beeping.xcframework.zip.cosign.bundle \
            Beeping.sbom.cdx.json \
            --clobber

      - name: Rewrite Package.swift binaryTarget to this tag's artifact (BEE-2259)
        # SPM consumers pin to a tag and read Package.swift AT THAT TAG. If
        # the tag points to a commit where Package.swift still references
        # the previous release's artifact, consumers pulling `from: "X.Y.Z"`
        # silently fetch the WRONG binary. This step rewrites Package.swift
        # with the just-built artifact URL + sha256, commits, then moves
        # the tag to the new commit so consumers always resolve coherent
        # artifacts.
        #
        # Push targets:
        #   1. Primary: push to main directly (requires GITHUB_TOKEN to
        #      bypass main branch protection, configured per-repo).
        #   2. Fallback: push to `release-state/${TAG}` so the new commit
        #      stays git-reachable even if main is protected; tag still
        #      gets force-recreated to point at it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          NEW_URL="https://github.com/beeping-io/beeping-ios/releases/download/${TAG}/Beeping.xcframework.zip"
          NEW_SHA=$(awk '{print $1}' dist/Beeping.xcframework.zip.sha256)

          git config user.name 'beeping-release-bot'
          git config user.email 'release-bot@beeping.io'

          # Rewrite Package.swift binaryTarget url + checksum AND
          # Beeping.podspec source sha256 (the URL is derived from
          # `s.version` so it auto-bumps; only the sha256 needs sync).
          # Python for safe in-place substitution — sed escaping is fragile.
          python3 - "$NEW_URL" "$NEW_SHA" <<'PY'
          import re, sys
          new_url, new_sha = sys.argv[1], sys.argv[2]

          # --- Package.swift ---
          with open('Package.swift') as f:
              s = f.read()
          s = re.sub(
              r'"https://github\.com/beeping-io/beeping-ios/releases/download/v[^/]+/Beeping\.xcframework\.zip"',
              f'"{new_url}"',
              s,
          )
          s = re.sub(
              r'(checksum: ")[a-f0-9]+(")',
              rf'\g<1>{new_sha}\g<2>',
              s,
          )
          with open('Package.swift', 'w') as f:
              f.write(s)

          # --- Beeping.podspec ---
          # The :http URL is built from `s.version` at podspec evaluation
          # time, so it auto-tracks the version bump. Only :sha256 needs
          # a literal rewrite per release.
          with open('Beeping.podspec') as f:
              p = f.read()
          p = re.sub(
              r'(:sha256\s*=>\s*")[a-f0-9]+(")',
              rf'\g<1>{new_sha}\g<2>',
              p,
          )
          with open('Beeping.podspec', 'w') as f:
              f.write(p)
          PY

          echo "----- Package.swift diff -----"
          git diff Package.swift || true
          echo "----- Beeping.podspec diff -----"
          git diff Beeping.podspec || true

          if git diff --quiet Package.swift Beeping.podspec; then
              echo "Manifests already pinned to ${TAG} — nothing to do."
              exit 0
          fi

          git add Package.swift Beeping.podspec
          git commit -m "chore(release): pin Package.swift + podspec to ${TAG} artifacts"

          # Try push to main first; if branch protection blocks, fall back.
          if git push origin HEAD:main 2>err.log; then
              echo "✓ pushed Package.swift sync directly to main"
          else
              echo "⚠ direct push to main blocked, falling back to release-state branch:"
              cat err.log || true
              git push origin "HEAD:release-state/${TAG}"
          fi

          # Force-move the tag to this new commit so SPM tag-pinned
          # consumers find the synced Package.swift at the tag.
          git tag -f "${TAG}"
          git push origin "${TAG}" --force

      - name: Summary
        run: |
          {
            echo "## Beeping ${{ steps.ver.outputs.tag }} — published"
            echo
            echo "**SHA256**: \`${{ steps.zip.outputs.checksum }}\`"
            echo
            echo "### Assets"
            echo "- \`Beeping.xcframework.zip\` — the XCFramework, statically embedding BeepingCore"
            echo "- \`Beeping.xcframework.zip.sha256\` — checksum line"
            echo "- \`Beeping.xcframework.zip.cosign.bundle\` — sigstore keyless bundle (signature + cert + rekor entry)"
            echo "- \`Beeping.sbom.cdx.json\` — CycloneDX SBOM"
            echo
            echo "Verify with \`scripts/verify-release.sh ${{ steps.ver.outputs.tag }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
