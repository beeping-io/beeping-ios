name: BeepingSampleApp
options:
  bundleIdPrefix: io.beeping.sample
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

projectReferences:
  Beeping:
    path: ../Beeping.xcodeproj

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    OTHER_CODE_SIGN_FLAGS: "--deep --force"
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_PREVIEWS: NO

targets:

  BeepingSampleApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: Beeping/Beeping
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.beeping.sample
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Beeping Sample
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Beeping uses the microphone to listen for audio beacons."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    preBuildScripts:
      - name: Generate Secrets.swift
        script: |
          set -euo pipefail
          "${SRCROOT}/Scripts/generate-secrets.sh" "${CONFIGURATION}"
        outputFiles:
          - $(SRCROOT)/Sources/Generated/Secrets.swift
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false

  BeepingSampleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BeepingSampleApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.beeping.sample.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BeepingSampleApp

  BeepingSampleAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BeepingSampleApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.beeping.sample.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BeepingSampleApp.app/BeepingSampleApp
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  BeepingSampleApp:
    build:
      targets:
        BeepingSampleApp: all
        BeepingSampleAppTests: [test]
        BeepingSampleAppUITests: [test]
    test:
      targets:
        - BeepingSampleAppTests
        - BeepingSampleAppUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
