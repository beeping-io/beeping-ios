name: PodConsumer
options:
  bundleIdPrefix: io.beeping.podconsumer
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    OTHER_CODE_SIGN_FLAGS: "--deep --force"

targets:
  PodConsumer:
    type: application
    platform: iOS
    sources:
      - path: PodConsumer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.beeping.podconsumer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Pod Consumer"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  PodConsumer:
    build:
      targets:
        PodConsumer: all
    run:
      config: Debug
    archive:
      config: Release
